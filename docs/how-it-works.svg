<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-label="How the librarian fits between you, your devices, your server and GitHub"><style>text{fill:#22201B;font-family:Karla,system-ui,sans-serif} .t{font-weight:700;font-size:15px} .s{font-size:12.5px;fill:#6B665A} .lbl{font-size:12.5px;font-weight:500}
.box{stroke:#8C8676;stroke-width:1.4} .arrow{fill:none;stroke:#22201B;stroke-width:2} .dash{stroke-dasharray:5 4}
.num circle{fill:#22201B} .num text{fill:#fff;font-weight:700;font-size:12px}</style><rect width="980" height="640" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22201B"/></marker></defs>
<circle cx="120" cy="80" r="34" fill="#E9C46A" stroke="#8C8676" stroke-width="1.4"/>
<circle cx="120" cy="68" r="11" fill="#fff" stroke="#22201B" stroke-width="1.6"/>
<path d="M98 104a22 22 0 0 1 44 0" fill="#fff" stroke="#22201B" stroke-width="1.6"/>
<text x="120" y="132" text-anchor="middle" class="t">You</text>

<rect x="30" y="190" width="200" height="220" rx="8" fill="#F1E3C4" class="box"/>
<text x="130" y="216" text-anchor="middle" class="t">Your devices</text>
<text x="130" y="234" text-anchor="middle" class="s">phone, laptop, Obsidian</text>
<rect x="95" y="252" width="34" height="62" rx="6" fill="#fff" stroke="#22201B" stroke-width="1.6"/>
<line x1="103" y1="266" x2="121" y2="266" stroke="#22201B" stroke-width="1.6"/>
<line x1="103" y1="276" x2="121" y2="276" stroke="#22201B" stroke-width="1.6"/>
<rect x="72" y="330" width="116" height="52" rx="5" fill="#fff" stroke="#22201B" stroke-width="1.6"/>
<line x1="62" y1="386" x2="198" y2="386" stroke="#22201B" stroke-width="1.6"/>
<text x="130" y="360" text-anchor="middle" class="s">a full copy of</text>
<text x="130" y="374" text-anchor="middle" class="s">every note</text>

<rect x="320" y="150" width="330" height="380" rx="10" fill="#DCE7EA" class="box"/>
<text x="485" y="178" text-anchor="middle" class="t">Your server</text>
<text x="485" y="196" text-anchor="middle" class="s">a small Linux box, always on</text>
<rect x="345" y="212" width="280" height="96" rx="6" fill="#fff" class="box"/>
<text x="485" y="240" text-anchor="middle" class="t">The vault</text>
<text x="485" y="260" text-anchor="middle" class="s">the master copy of the notes</text>
<text x="485" y="278" text-anchor="middle" class="s">every change kept in git</text>
<rect x="345" y="380" width="280" height="126" rx="6" fill="#FFE7B0" class="box"/>
<text x="485" y="408" text-anchor="middle" class="t">The librarian (AI)</text>
<text x="485" y="428" text-anchor="middle" class="s">works only on a photocopy, 3 am</text>
<text x="485" y="446" text-anchor="middle" class="s">can only read and write notes</text>
<text x="485" y="464" text-anchor="middle" class="s">no journal; its one line out is to Claude</text>
<text x="485" y="490" text-anchor="middle" class="s" font-style="italic">the photocopy is thrown away at sunrise</text>

<rect x="360" y="570" width="250" height="52" rx="26" fill="#E4EEF6" class="box"/>
<text x="485" y="592" text-anchor="middle" class="t">Claude</text>
<text x="485" y="609" text-anchor="middle" class="s">the brain it thinks with, its only line out</text>

<rect x="740" y="190" width="215" height="130" rx="8" fill="#D9D4E8" class="box"/>
<text x="847" y="218" text-anchor="middle" class="t">The report desk</text>
<text x="847" y="236" text-anchor="middle" class="s">(GitHub)</text>
<text x="847" y="262" text-anchor="middle" class="s">each night's filing,</text>
<text x="847" y="278" text-anchor="middle" class="s">written up so you can read it,</text>
<text x="847" y="294" text-anchor="middle" class="s">comment, or undo it</text>

<rect x="740" y="440" width="215" height="84" rx="8" fill="#D8E8D6" class="box dash"/>
<text x="847" y="468" text-anchor="middle" class="t">Backup</text>
<text x="847" y="486" text-anchor="middle" class="s">(bring your own)</text>
<text x="847" y="504" text-anchor="middle" class="s">a spare copy, on a schedule</text>

<path d="M120 120 V 186" class="arrow" marker-end="url(#a)"/><g class="num" transform="translate(146 150)"><circle r="11"/><text text-anchor="middle" dy="4">1</text></g>
<path d="M234 260 H 341" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><g class="num" transform="translate(288 242)"><circle r="11"/><text text-anchor="middle" dy="4">2</text></g>
<text x="288" y="280" text-anchor="middle" class="lbl">kept identical</text>
<path d="M485 312 V 376" class="arrow" marker-end="url(#a)"/><g class="num" transform="translate(508 344)"><circle r="11"/><text text-anchor="middle" dy="4">3</text></g>
<text x="440" y="348" text-anchor="middle" class="lbl">photocopy</text>
<path d="M485 510 V 566" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><g class="num" transform="translate(508 538)"><circle r="11"/><text text-anchor="middle" dy="4">4</text></g>
<path d="M629 420 H 847 V 324" class="arrow" marker-end="url(#a)"/><g class="num" transform="translate(700 402)"><circle r="11"/><text text-anchor="middle" dy="4">5</text></g>
<text x="740" y="406" class="lbl">the night's report</text>
<path d="M158 70 H 847 V 186" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><g class="num" transform="translate(500 52)"><circle r="11"/><text text-anchor="middle" dy="4">7</text></g>
<text x="520" y="57" class="lbl">morning: you read it, fix or leave a note</text>
<path d="M736 250 H 629" class="arrow" marker-end="url(#a)"/><g class="num" transform="translate(682 232)"><circle r="11"/><text text-anchor="middle" dy="4">6</text></g>
<text x="682" y="270" text-anchor="middle" class="lbl">after a check</text>
<path d="M654 482 H 736" class="arrow dash" marker-end="url(#a)"/><g class="num" transform="translate(695 464)"><circle r="11"/><text text-anchor="middle" dy="4">8</text></g>
</svg>
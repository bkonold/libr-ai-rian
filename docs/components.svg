<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-label="The components, named"><style>text{fill:#22201B;font-family:Karla,system-ui,sans-serif} .t{font-weight:700;font-size:15px} .s{font-size:12.5px;fill:#6B665A} .lbl{font-size:12.5px;font-weight:500}
.box{stroke:#8C8676;stroke-width:1.4} .arrow{fill:none;stroke:#22201B;stroke-width:2} .dash{stroke-dasharray:5 4}
.num circle{fill:#22201B} .num text{fill:#fff;font-weight:700;font-size:12px}</style><rect width="1000" height="670" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22201B"/></marker></defs><g class="comp"><rect x="30" y="80" width="220" height="250" rx="6" fill="#F1E3C4" class="box"/><text x="140.0" y="101" text-anchor="middle" class="t" font-size="15">Devices</text><text x="140.0" y="118" text-anchor="middle" class="s">Obsidian on each,</text><text x="140.0" y="133" text-anchor="middle" class="s">a full copy of the vault</text></g><g class="comp"><rect x="50" y="140" width="180" height="44" rx="6" fill="#fff" class="box"/><text x="140.0" y="161" text-anchor="middle" class="t" font-size="13">Laptop</text><text x="140.0" y="178" text-anchor="middle" class="s">sync client</text></g><g class="comp"><rect x="50" y="196" width="180" height="44" rx="6" fill="#fff" class="box"/><text x="140.0" y="217" text-anchor="middle" class="t" font-size="13">Phone</text><text x="140.0" y="234" text-anchor="middle" class="s">sync client</text></g><g class="comp"><rect x="50" y="252" width="180" height="44" rx="6" fill="#fff" class="box dash"/><text x="140.0" y="273" text-anchor="middle" class="t" font-size="13">Sync</text><text x="140.0" y="290" text-anchor="middle" class="s">bring your own</text></g><g class="comp"><rect x="300" y="80" width="460" height="580" rx="6" fill="#fff" class="box"/><text x="530.0" y="101" text-anchor="middle" class="t" font-size="15">Server</text><text x="530.0" y="118" text-anchor="middle" class="s">Linux, systemd, always on</text></g><g class="comp"><rect x="320" y="130" width="180" height="52" rx="6" fill="#fff" class="box dash"/><text x="410.0" y="151" text-anchor="middle" class="t" font-size="15">Sync</text><text x="410.0" y="168" text-anchor="middle" class="s">bring your own: Syncthing,</text><text x="410.0" y="183" text-anchor="middle" class="s">a mount, or edit here</text></g><g class="comp"><rect x="320" y="210" width="180" height="130" rx="6" fill="#fff" class="box"/><text x="410.0" y="231" text-anchor="middle" class="t" font-size="15">Vault</text><text x="410.0" y="248" text-anchor="middle" class="s">VAULT_DIR</text><text x="410.0" y="263" text-anchor="middle" class="s">plain files + git history</text></g><g class="comp"><rect x="335" y="285" width="150" height="44" rx="6" fill="#FFF7E6" class="box"/><text x="410.0" y="306" text-anchor="middle" class="t" font-size="13">Daily note</text><text x="410.0" y="323" text-anchor="middle" class="s">daily/YYYY/…, the inbox</text></g><g class="comp"><rect x="320" y="365" width="180" height="44" rx="6" fill="#fff" class="box"/><text x="410.0" y="386" text-anchor="middle" class="t" font-size="13">Newday</text><text x="410.0" y="403" text-anchor="middle" class="s">00:05: creates today&#x27;s note</text></g><g class="comp"><rect x="320" y="430" width="180" height="52" rx="6" fill="#fff" class="box"/><text x="410.0" y="451" text-anchor="middle" class="t" font-size="15">Config</text><text x="410.0" y="468" text-anchor="middle" class="s">/etc/librarian: env, tokens</text></g><g class="comp"><rect x="320" y="505" width="180" height="52" rx="6" fill="#fff" class="box dash"/><text x="410.0" y="526" text-anchor="middle" class="t" font-size="15">Backup</text><text x="410.0" y="543" text-anchor="middle" class="s">bring your own</text></g><g class="comp"><rect x="320" y="580" width="180" height="44" rx="6" fill="#F6E1DC" class="box"/><text x="410.0" y="601" text-anchor="middle" class="t" font-size="13">Stop file</text><text x="410.0" y="618" text-anchor="middle" class="s">optional tripwire</text></g><g class="comp"><rect x="520" y="130" width="220" height="400" rx="6" fill="#FFE7B0" class="box"/><text x="630.0" y="151" text-anchor="middle" class="t" font-size="15">Nightly</text><text x="630.0" y="168" text-anchor="middle" class="s">librarian-nightly, 03:00, bash</text></g><g class="comp"><rect x="540" y="185" width="180" height="52" rx="6" fill="#fff" class="box"/><text x="630.0" y="206" text-anchor="middle" class="t" font-size="15">Worktree</text><text x="630.0" y="223" text-anchor="middle" class="s">throwaway copy of the vault</text></g><g class="comp"><rect x="540" y="262" width="180" height="52" rx="6" fill="#fff" class="box"/><text x="630.0" y="283" text-anchor="middle" class="t" font-size="15">Model</text><text x="630.0" y="300" text-anchor="middle" class="s">claude -p, five file tools</text></g><g class="comp"><rect x="540" y="340" width="180" height="52" rx="6" fill="#fff" class="box"/><text x="630.0" y="361" text-anchor="middle" class="t" font-size="15">Guard</text><text x="630.0" y="378" text-anchor="middle" class="s">says yes/no to every file call</text></g><g class="comp"><rect x="540" y="418" width="180" height="52" rx="6" fill="#fff" class="box"/><text x="630.0" y="439" text-anchor="middle" class="t" font-size="15">Rules</text><text x="630.0" y="456" text-anchor="middle" class="s">CLAUDE.md · lessons.md · prompts</text></g><g class="comp"><rect x="800" y="80" width="180" height="70" rx="6" fill="#fff" class="box"/><text x="890.0" y="101" text-anchor="middle" class="t" font-size="15">GitHub</text><text x="890.0" y="118" text-anchor="middle" class="s">private vault repo: history,</text><text x="890.0" y="133" text-anchor="middle" class="s">one PR per night</text></g><g class="comp"><rect x="800" y="253" width="180" height="70" rx="6" fill="#fff" class="box"/><text x="890.0" y="274" text-anchor="middle" class="t" font-size="15">Claude</text><text x="890.0" y="291" text-anchor="middle" class="s">the Model&#x27;s brain,</text><text x="890.0" y="306" text-anchor="middle" class="s">over the internet</text></g><g class="comp"><rect x="800" y="400" width="180" height="70" rx="6" fill="#fff" class="box"/><text x="890.0" y="421" text-anchor="middle" class="t" font-size="15">Healthchecks</text><text x="890.0" y="438" text-anchor="middle" class="s">one check; emails you</text><text x="890.0" y="453" text-anchor="middle" class="s">when a ping is late</text></g><path d="M254 156 H 316" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><text x="285" y="148" text-anchor="middle" class="lbl">sync</text><path d="M410 186 V 206" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><path d="M410 361 V 344" class="arrow" marker-end="url(#a)"/><path d="M504 250 H 536 V 215" class="arrow" marker-end="url(#a)"/><text x="516" y="244" text-anchor="start" class="lbl">copy</text><path d="M540 300 H 504" class="arrow" marker-end="url(#a)"/><text x="521" y="318" text-anchor="middle" class="lbl">ff-pull</text><path d="M630 318 V 336" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><path d="M630 396 V 414" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><path d="M724 288 H 796" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><text x="760" y="280" text-anchor="middle" class="lbl">thinks</text><path d="M744 150 H 796 V 150" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><text x="770" y="142" text-anchor="middle" class="lbl">PR, comments</text><path d="M504 456 H 536" class="arrow" marker-end="url(#a)"/><text x="520" y="476" text-anchor="middle" class="lbl">tokens</text><path d="M744 435 H 796" class="arrow" marker-end="url(#a)"/><text x="770" y="427" text-anchor="middle" class="lbl">ok / fail</text><path d="M410 561 V 576" class="arrow" marker-end="url(#a)"/><path d="M504 602 H 630 V 534" class="arrow dash" marker-end="url(#a)"/><text x="560" y="594" text-anchor="start" class="lbl">blocks</text><path d="M140 76 V 40 H 890 V 76" class="arrow" marker-start="url(#a)" marker-end="url(#a)"/><text x="515" y="34" text-anchor="middle" class="lbl">you read the PR, comment, fix</text></svg>